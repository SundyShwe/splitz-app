<nav class="navbar navbar-expand-lg navbar-light p-3">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="['']"
      ><span class="h1">SPLITZ</span>
      @if (authService.state().jwt) {
        <small class="text-muted">
          | Welcome {{ authService.state().fullname }}</small
          >
        }
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNavDropdown"
        aria-controls="navbarNavDropdown"
        aria-expanded="false"
        aria-label="Toggle navigation"
        >
        <span class="navbar-toggler-icon"></span>
      </button>

      @if (authService.state().jwt) {
        <div
          class="collapse navbar-collapse"
          id="navbarNavDropdown"
          >
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link mx-2"
                id="lnkHome"
                aria-current="page"
                routerLink="home"
                [routerLinkActive]="['active']"
                >Home
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link mx-2"
                routerLink="groups"
                id="lnkGroups"
                [routerLinkActive]="['active']"
                >Groups
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link mx-2"
                routerLink="profile"
                id="lnkMyAccount"
                [routerLinkActive]="['active']"
                >My Account
              </a>
            </li>
            <li class="nav-item">
              <button id="lnkSingOut" class="nav-link mx-2" (click)="onSignOut()">
                Sign Out
              </button>
            </li>
          </ul>
        </div>
      } @else {
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                [routerLink]="['signin']"
                class="nav-link"
                [routerLinkActive]="['active']"
                >Sign In</a
                >
              </li>
              <li class="nav-item">
                <a
                  [routerLink]="['signup']"
                  class="nav-link"
                  [routerLinkActive]="['active']"
                  >Sign Up</a
                  >
                </li>
              </ul>
            </div>
          }
        </div>
      </nav>
